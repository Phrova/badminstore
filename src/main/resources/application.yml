# ==============================================================================
# BadStore – cấu hình chung (commit). Ghi đè: application-local.yml -> biến môi trường.
# Bí mật (mật khẩu, token) không ghi ở đây: xem .env.example hoặc docs/HUONG_DAN_CHAY.md mục 3.
# ==============================================================================
spring:
  application:
    name: badstore
  profiles:
    default: local                       # không truyền profile vẫn nạp application-local.yml

  datasource:                            # SQL Server
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BadminStore;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate                 # đổi bảng => sửa docs/BadStore_full.sql
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false                         # true khi deploy
  servlet:
    multipart:
      max-file-size: 5MB                 # ảnh sản phẩm admin tải lên
      max-request-size: 10MB

server:
  port: 8088
  servlet:
    encoding:
      force: true                        # ép UTF-8 cho request/response

app:
  upload-dir: ${UPLOAD_DIR:uploads}

  admin:                                 # DataInitializer: tạo ADMIN lần đầu (BCrypt)
    email: ${ADMIN_EMAIL:admin@badstore.local}
    password: ${ADMIN_PASSWORD:}         # trống => không tạo tài khoản nào

  shop:                                  # phiếu bán tại quầy + chân trang
    name: ${SHOP_NAME:BadStore}
    address: "${SHOP_ADDRESS:FPT Polytechnic}"
    hotline: ${SHOP_HOTLINE:1900 0000}
    email: ${SHOP_EMAIL:cskh@badstore.local}

  payment:
    bank:                                # VietQR (dữ liệu demo, đổi khi chạy thật)
      enabled: ${BANK_QR_ENABLED:true}
      bank-code: ${BANK_CODE:MB}
      bank-name: ${BANK_NAME:MB Bank (Ngân hàng Quân đội)}
      account-number: ${BANK_ACCOUNT_NUMBER:0123456789}
      account-name: ${BANK_ACCOUNT_NAME:CONG TY BADSTORE DEMO}

  ghn:                                   # Giao Hàng Nhanh (tuỳ chọn)
    enabled: ${GHN_ENABLED:true}
    mock: ${GHN_MOCK:true}               # true = offline: dùng resources/ghn/*.json
    mock-status: ${GHN_MOCK_STATUS:delivering}
    environment: ${GHN_ENVIRONMENT:staging}
    allow-production: ${GHN_ALLOW_PRODUCTION:false}
    base-url: ${GHN_BASE_URL:https://dev-online-gateway.ghn.vn/shiip/public-api}
    print-base-url: ${GHN_PRINT_BASE_URL:https://dev-online-gateway.ghn.vn}
    token: ${GHN_TOKEN:2d976526-fe2a-44c4-9c83-81d40250c877}                 # không commit token
    shop-id: ${GHN_SHOP_ID:2546099}
    address-model: ${GHN_ADDRESS_MODEL:auto}   # auto | new | legacy
    from-district-id: ${GHN_FROM_DISTRICT_ID:}
    from-ward-code: ${GHN_FROM_WARD_CODE:}
    from-name: ${app.shop.name}
    from-phone: ${GHN_FROM_PHONE:0900000000}
    from-address: ${app.shop.address}
    webhook:                             # chỉ bật khi có URL công khai + secret
      enabled: ${GHN_WEBHOOK_ENABLED:false}
      secret: ${GHN_WEBHOOK_SECRET:}
      header-name: ${GHN_WEBHOOK_HEADER:X-GHN-Signature}
    sync-enabled: ${GHN_SYNC_ENABLED:false}
